name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Même version de npm qu'en local : npm 10 et npm 11 n'interprètent pas le lockfile de la même façon.
      - name: Aligner la version de npm
        run: npm install -g npm@11.6.2
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types (TypeScript strict)
        run: npm run typecheck
      - name: Lancer les tests
        run: npm test
      - name: Construire la version de production
        run: npm run build
